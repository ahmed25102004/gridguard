# GridGuard EMQX - Sprint 1 MQTT Security Baseline

# MQTT listener
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1000
}

# Disable anonymous MQTT connections
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    password_hash_algorithm {
      name = sha256
      salt_rounds = 10
    }
  }
]

# Connection and message limits
mqtt.max_packet_size = 1MB
mqtt.max_clientid_len = 128
mqtt.max_topic_levels = 10
mqtt.max_qos_allowed = 1
mqtt.max_topic_alias = 0

# Resource protection
zones.default.max_publish_rate {
  rate = 1000
  burst = 100
}

zones.default.max_subscribe_rate {
  rate = 100
  burst = 20
}
